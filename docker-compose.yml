services:
  postgres:
    image: postgres:17
    container_name: procesamiento-masivo-db
    environment:
      POSTGRES_DB: procesamiento_masivo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procesamiento_masivo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: